name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The generated code must be exactly what the spec in the repo produces.
      - name: Generated code is up to date
        run: npm run generate && git diff --exit-code
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Read-only calls to the real API, checked against the spec. Needs a key
  # with email:read and domain:read in the SMTPFAST_API_KEY secret.
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          SMTPFAST_API_KEY: ${{ secrets.SMTPFAST_API_KEY }}
